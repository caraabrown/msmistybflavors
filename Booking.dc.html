<script type="text/x-dc" data-dc-script>
const BOOKING_NUMBER = '15102904000'; // TODO: replace with the real booking number
const SERVICES = ['Video or Photoshoot Styling', 'Hair Styling', 'Set Design', 'Product Styling', 'Personal Brand Consulting', 'Event Hosting', 'Interviewing'];

class Component extends DCLogic {
  state = { name: '', phone: '', service: [], eventInfo: '', message: '' };

  renderVals() {
    const { name, phone, service, eventInfo, message } = this.state;
    const lines = [
      'Booking request:',
      name ? `Name: ${name}` : '',
      phone ? `Phone: ${phone}` : '',
      service.length ? `Service: ${service.join(', ')}` : '',
      eventInfo ? `Event: ${eventInfo}` : '',
      message ? `Details: ${message}` : '',
    ].filter(Boolean).join('\n');
    const smsHref = `sms:${BOOKING_NUMBER}?&body=${encodeURIComponent(lines)}`;

    const serviceOptions = SERVICES.map((label) => ({
      label,
      checked: service.includes(label),
      toggle: () => this.setState((s) => ({
        service: s.service.includes(label) ? s.service.filter((x) => x !== label) : [...s.service, label],
      })),
    }));

    return {
      name, phone, service, serviceOptions, eventInfo, message, smsHref,
      setName: (e) => this.setState({ name: e.target.value }),
      setPhone: (e) => this.setState({ phone: e.target.value }),
      setEventInfo: (e) => this.setState({ eventInfo: e.target.value }),
      setMessage: (e) => this.setState({ message: e.target.value }),
    };
  }
}

</script>
